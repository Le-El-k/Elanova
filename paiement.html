<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta name="description" content="Retour de paiement SoleasPay — ÉLANOVA." />
    <title>Retour de paiement — ÉLANOVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#payment-result">Aller au résultat du paiement</a>
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="index.html" aria-label="ÉLANOVA, accueil">
          <svg class="brand-mark" viewBox="0 0 42 42" aria-hidden="true"><path d="M21 3.5 38.5 21 21 38.5 3.5 21 21 3.5Z" fill="currentColor"/><path d="M21 12v18M12 21h18" stroke="#f8f7f2" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="21" r="3.2" fill="#f27a59"/></svg>
          <span>ÉLANOVA<span class="brand-period">.</span></span>
        </a>
        <a class="button button-small button-dark" href="projets.html#votes">Retour aux projets <span aria-hidden="true">↗</span></a>
      </div>
    </header>
    <main class="payment-return-page">
      <section class="payment-return-card" id="payment-result" aria-live="polite">
        <div class="section-kicker">RETOUR SOLEASPAY</div>
        <h1 id="payment-return-title">Vérification du paiement</h1>
        <p id="payment-return-message">Lecture du résultat transmis par SoleasPay…</p>
        <p class="payment-return-reference" id="payment-return-reference" hidden></p>
        <p class="payment-return-note">Conservez la référence de transaction pour le suivi et la confirmation de votre contribution.</p>
        <a class="button button-dark" id="payment-return-link" href="projets.html#votes">Retourner aux projets <span aria-hidden="true">↗</span></a>
      </section>
    </main>
    <script>
      const query = new URLSearchParams(window.location.search);
      const apiUrl = String(window.ELANOVA_API_URL || "").trim().replace(/\/+$/, "");
      let paymentData = null;
      try {
        const rawData = query.get("soleaspay_data");
        if (rawData) paymentData = JSON.parse(rawData);
      } catch {
        paymentData = null;
      }

      const title = document.getElementById("payment-return-title");
      const message = document.getElementById("payment-return-message");
      const reference = document.getElementById("payment-return-reference");
      const returnLink = document.getElementById("payment-return-link");
      const transactionReference = paymentData?.transaction_reference || paymentData?.reference;
      const orderId = query.get("order_id") || paymentData?.invoice_reference;
      const failureStatus = ["FAILED", "CANCELLED", "REFUNDED"].includes(String(paymentData?.status || "").toUpperCase());

      if (transactionReference) {
        reference.hidden = false;
        reference.textContent = `Référence de transaction : ${transactionReference}`;
      }

      const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

      async function confirmVote() {
        if (failureStatus || query.get("retour") === "echec") {
          title.textContent = "Paiement non confirmé";
          message.textContent = "Le paiement n'a pas abouti ou a été annulé. Vous pouvez réessayer depuis la page du projet.";
          return;
        }
        if (!transactionReference || !orderId) {
          title.textContent = "Vérification impossible";
          message.textContent = "La référence de commande ou de transaction manque dans le retour SoleasPay. Aucun vote n'a été ajouté.";
          return;
        }
        if (!apiUrl) {
          title.textContent = "Paiement reçu, vérification en attente";
          message.textContent = "Le service de vérification des paiements n'est pas encore connecté. Aucun vote ne sera affiché avant cette vérification.";
          return;
        }

        title.textContent = "Vérification du paiement";
        message.textContent = "Nous vérifions la transaction auprès de SoleasPay…";
        for (let attempt = 0; attempt < 7; attempt += 1) {
          try {
            const response = await fetch(`${apiUrl}/api/votes/confirm`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ orderId, transactionReference })
            });
            const result = await response.json().catch(() => ({}));
            if (response.status === 202 || result.pending) {
              title.textContent = "Paiement en cours";
              message.textContent = "SoleasPay traite encore la transaction. La vérification continue automatiquement.";
              await wait(5000);
              continue;
            }
            if (!response.ok) throw new Error(result.message || "La vérification n'a pas abouti.");
            if (result.confirmed) {
              title.textContent = "Vote confirmé";
              message.textContent = `Le paiement est confirmé par SoleasPay. Ce projet compte maintenant ${new Intl.NumberFormat("fr-FR").format(result.count)} voix confirmée${result.count === 1 ? "" : "s"}.`;
              if (result.projectId) {
                returnLink.href = `projet.html?projet=${encodeURIComponent(result.projectId)}`;
                returnLink.innerHTML = 'Voir le projet <span aria-hidden="true">↗</span>';
              }
              return;
            }
            title.textContent = "Paiement non confirmé";
            message.textContent = "SoleasPay n'indique pas un paiement réussi. Aucun vote n'a été comptabilisé.";
            return;
          } catch (error) {
            title.textContent = "Vérification momentanément indisponible";
            message.textContent = `${error.message || "Le service de vérification ne répond pas."} Rechargez cette page plus tard pour vérifier le résultat.`;
            return;
          }
        }
        title.textContent = "Paiement toujours en cours";
        message.textContent = "SoleasPay n'a pas encore confirmé le paiement. Aucun vote n'est comptabilisé pour le moment. Vous pouvez recharger cette page plus tard.";
      }

      confirmVote();
    </script>
  </body>
</html>
