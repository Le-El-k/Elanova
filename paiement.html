<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta name="description" content="Retour de paiement SoleasPay — ÉLANOVA." />
    <title>Retour de paiement — ÉLANOVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2" />
    <script src="vote-storage.js?v=2"></script>
    <script src="vote-remote.js?v=2"></script>
  </head>
  <body>
    <a class="skip-link" href="#payment-result">Aller au résultat du paiement</a>
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="index.html" aria-label="ÉLANOVA, accueil">
          <svg class="brand-mark" viewBox="0 0 42 42" aria-hidden="true"><path d="M21 3.5 38.5 21 21 38.5 3.5 21 21 3.5Z" fill="currentColor"/><path d="M21 12v18M12 21h18" stroke="#f8f7f2" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="21" r="3.2" fill="#f27a59"/></svg>
          <span>ÉLANOVA<span class="brand-period">.</span></span>
        </a>
        <a class="button button-small button-dark" href="projets.html#votes">Retour aux projets <span aria-hidden="true">↗</span></a>
      </div>
    </header>
    <main class="payment-return-page">
      <section class="payment-return-card" id="payment-result" aria-live="polite">
        <div class="section-kicker">RETOUR SOLEASPAY</div>
        <h1 id="payment-return-title">Vérification du paiement</h1>
        <p id="payment-return-message">Lecture du résultat transmis par SoleasPay…</p>
        <p class="payment-return-reference" id="payment-return-reference" hidden></p>
        <p class="payment-return-note" id="payment-return-note">Votre voix est enregistrée dans le décompte partagé à partir du retour SoleasPay.</p>
        <a class="button button-dark" id="payment-return-link" href="projets.html#votes">Retourner aux projets <span aria-hidden="true">↗</span></a>
      </section>
    </main>
    <script>
      const query = new URLSearchParams(window.location.search);
      let paymentData = null;
      try {
        const rawData = query.get("soleaspay_data");
        if (rawData) paymentData = JSON.parse(rawData);
      } catch {
        paymentData = null;
      }

      const title = document.getElementById("payment-return-title");
      const message = document.getElementById("payment-return-message");
      const reference = document.getElementById("payment-return-reference");
      const note = document.getElementById("payment-return-note");
      const returnLink = document.getElementById("payment-return-link");
      const transactionReference = paymentData?.transaction_reference || paymentData?.reference;
      const orderId = query.get("order_id") || paymentData?.invoice_reference;
      const status = String(paymentData?.status || "").toUpperCase();
      const projectIds = ["mlab-best-soap", "agromboa-direct", "savoirs-en-mouvement", "restart-mobile", "agripulse-local", "naya-racines"];

      if (transactionReference) {
        reference.hidden = false;
        reference.textContent = `Référence de transaction : ${transactionReference}`;
      }

      function showPaymentResult() {
        if (["FAILED", "CANCELLED", "REFUNDED"].includes(status) || query.get("retour") === "echec") {
          if (orderId) {
            try { window.ELANOVA_VOTE_STORAGE.discardOrder(orderId); } catch { /* Le score reste inchangé si le stockage est indisponible. */ }
          }
          title.textContent = "Paiement non confirmé";
          message.textContent = "Le paiement n'a pas abouti ou a été annulé. Vous pouvez réessayer depuis la page du projet.";
          return;
        }
        if (!status) {
          title.textContent = "Vote effectué avec succès";
          message.hidden = true;
          reference.hidden = true;
          note.hidden = true;
          return;
        }
        if (!["SUCCESS", "COMPLETED"].includes(status)) {
          title.textContent = status ? "Paiement en cours" : "Retour de paiement reçu";
          message.textContent = status
            ? `SoleasPay indique ${status}. Aucun vote n'est ajouté avant le retour d'un statut réussi.`
            : "SoleasPay n'a pas transmis de statut exploitable. Aucun vote n'a été ajouté.";
          return;
        }

        title.textContent = "Vote effectué avec succès";
        message.hidden = true;
        reference.hidden = true;
        note.hidden = true;

        let result;
        try {
          result = window.ELANOVA_VOTE_STORAGE.recordPayment(paymentData, projectIds);
        } catch {
          result = { recorded: false };
        }

        // Projet concerné : fourni par le stockage local, sinon déduit de l'orderId.
        let projectId = result.recorded ? result.projectId : null;
        if (!projectId && orderId) {
          projectId = projectIds.find((id) => String(orderId).startsWith(`ELANOVA-${id}-`)) || null;
        }

        if (projectId) {
          returnLink.href = `projet.html?projet=${encodeURIComponent(projectId)}`;
          returnLink.innerHTML = 'Voir le projet <span aria-hidden="true">↗</span>';
        }

        // Enregistrement dans le décompte partagé (idempotent : même référence = pas de double comptage).
        if (projectId && transactionReference && window.ELANOVA_VOTE_REMOTE?.isConfigured?.()) {
          window.ELANOVA_VOTE_REMOTE.recordPayment({
            transactionReference,
            projectId,
            amount: Number(paymentData?.amount),
            status
          }).catch(() => { /* Le total partagé se mettra à jour au prochain retour réussi. */ });
        }
      }

      showPaymentResult();
    </script>
  </body>
</html>
