services:
  - type: web
    name: elanova-vote-api
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://le-el-k.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: elanova-votes-db
          property: connectionString

databases:
  - name: elanova-votes-db
    databaseName: elanova_votes
    user: elanova_votes_user
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
